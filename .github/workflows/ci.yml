name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable Corepack
        run: corepack enable

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # RATE_LIMIT_DISABLED is a local-e2e-only bypass (followups §4). It must
      # never ship in a deploy manifest — a prod worker with rate limiting off
      # is an open door. Secrets are checked manually; this pins the repo side.
      - name: Guard against rate-limit bypass in deploy config
        run: |
          if grep -rn "RATE_LIMIT_DISABLED" apps/api/wrangler.toml; then
            echo "::error::RATE_LIMIT_DISABLED found in apps/api/wrangler.toml — this dev-only bypass must not be configured via the deploy manifest."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
